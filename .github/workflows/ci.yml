name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers uses the Docker daemon preinstalled on the runner. The build also fails if
      # coverage drops below the floor configured for JaCoCo in pom.xml.
      - name: Build, test and check coverage
        run: mvn -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/site/jacoco
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  docker-smoke:
    name: Docker image and end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240 app
      - name: Smoke test the running API
        run: bash scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop the stack
        if: always()
        run: docker compose down -v
