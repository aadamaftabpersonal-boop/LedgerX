spring:
  application:
    name: ledgerx
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerx
    username: ledgerx
    password: ledgerx
  flyway:
    enabled: true

ledgerx:
  # Enables /admin/*, which creates API clients and runs reconciliation. Leave empty to disable.
  admin-key: ${LEDGERX_ADMIN_KEY:}
  transfer:
    lock-strategy: PESSIMISTIC # or CONDITIONAL_UPDATE
  reconciliation:
    enabled: true
    interval: PT5M
    initial-delay: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ledgerx
