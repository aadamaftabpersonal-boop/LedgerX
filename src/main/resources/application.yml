spring:
  application:
    name: ledgerx
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerx
    username: ledgerx
    password: ledgerx
  flyway:
    enabled: true

ledgerx:
  # Enables POST /admin/clients, which creates API clients. Leave empty to disable it.
  admin-key: ${LEDGERX_ADMIN_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
